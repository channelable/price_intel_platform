name: Scrape prices

on:
  workflow_dispatch:
  schedule:
    # UTC. :23 keeps it off the top of the hour; GitHub may delay further
    # under load, which adds natural jitter.
    - cron: "23 */6 * * *"

permissions:
  contents: read

# Never let a manual run and a scheduled run overlap.
concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e .

      - name: Ensure schema exists
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m price_intel.db.init_db

      - name: Sync seed catalog
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/seed_products.py

      - name: Scrape active products
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONUNBUFFERED: "1"
        run: python scripts/scrape_all.py

      # The scrape just touched every active product, so anything older than
      # an hour means the run skipped it. The API will use the 8h default.
      - name: Check data freshness
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/check_freshness.py --max-age-hours 1

      - name: Upload scrape log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-log
          path: data/scrape.log
          if-no-files-found: ignore

      # A missing secret would otherwise make the pings silent no-ops.
      - name: Verify Healthchecks is configured
        env:
          HC_URL: ${{ secrets.HEALTHCHECKS_PING_URL }}
        run: |
          if [ -z "$HC_URL" ]; then
            echo "::warning::HEALTHCHECKS_PING_URL is not set; liveness pings are disabled"
          fi

      # Dead-man's switch: a missed ping (failed run or disabled schedule)
      # triggers an alert in Healthchecks.io.
      - name: Ping Healthchecks on success
        if: success()
        env:
          HC_URL: ${{ secrets.HEALTHCHECKS_PING_URL }}
        run: curl -fsS -m 10 --retry 3 "$HC_URL" > /dev/null || true

      - name: Ping Healthchecks on failure
        if: failure()
        env:
          HC_URL: ${{ secrets.HEALTHCHECKS_PING_URL }}
        run: curl -fsS -m 10 --retry 3 "$HC_URL/fail" > /dev/null || true
