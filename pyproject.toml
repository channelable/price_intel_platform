[project]
name = "price-intel"
version = "0.1.0"
description = "BuyHatke-style price tracker with an end-to-end ML pipeline"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]
# Dev-only fallback for machines without Docker (see scripts/dev_db.py).
# Production and CI still use the Postgres service from docker-compose.yml.
localdev = [
    "pgserver>=0.1.4",
    "psutil>=5.9",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
